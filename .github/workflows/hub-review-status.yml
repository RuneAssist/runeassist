name: Hub review status

# The Plugin Hub review routine reads every pull request and posts one comment that
# starts with "**Plugin Hub review: PASS**" or "**Plugin Hub review: FAIL (N problems)**".
# Its token cannot write commit statuses, so this turns that comment into the required
# `hub-review` status on the pull request's head commit, the way the Hub's own bot
# reports "RuneLite Plugin Hub Checks". Only a comment from the repository owner's
# account counts; anyone else's comment with the same words is ignored.

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose latest review comment should set the status
        required: true
        type: string

permissions:
  statuses: write
  pull-requests: read

jobs:
  status:
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request
          && github.event.comment.author_association == 'OWNER'
          && startsWith(github.event.comment.body, '**Plugin Hub review: '))
    runs-on: ubuntu-latest
    steps:
      - name: Set hub-review on the head commit from the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          if [ -z "$BODY" ]; then
            # Manual run: the newest review comment by the owner on that pull request.
            BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.author_association=="OWNER" and (.body | startswith("**Plugin Hub review: ")))] | last | .body // ""')
            COMMENT_URL=$(gh api "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.author_association=="OWNER" and (.body | startswith("**Plugin Hub review: ")))] | last | .html_url // ""')
          fi
          first=$(printf '%s' "$BODY" | head -n1 | tr -d '*' | tr -d '\r')
          case "$first" in
            "Plugin Hub review: PASS"*) state=success ;;
            "Plugin Hub review: FAIL"*) state=failure ;;
            *) echo "not a verdict: $first"; exit 0 ;;
          esac
          sha=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha)
          gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
            -f state="$state" -f context=hub-review -f description="${first:0:140}" \
            -f target_url="$COMMENT_URL" >/dev/null
          echo "hub-review=$state on $sha"
