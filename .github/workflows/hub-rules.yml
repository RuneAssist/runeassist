name: Plugin Hub rules

# Every PR is checked against what the RuneLite Plugin Hub will check, so a Hub
# review never bounces us for something we could have caught here:
#   rules  - reviewer rules (no thread interrupts, no reflection, Filepath for
#            file i/o, ...) and the packager's manifest/icon/licence checks.
#            See docs/hub-rules.md and scripts/hub_rules.py.
#   build  - compile and test against the exact RuneLite version pinned in
#            runelite/plugin-hub, on Java 11 like the Hub packager. Catches API
#            changes (e.g. 1.13.0 made GE offer prices long) before review.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Plugin Hub rules
        run: python3 scripts/hub_rules.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Read the RuneLite version the Hub builds with
        id: hub
        run: |
          v=$(curl -fsS -m 20 https://raw.githubusercontent.com/runelite/plugin-hub/master/runelite.version | tr -d '[:space:]')
          [ -n "$v" ] || { echo "could not read runelite.version" >&2; exit 1; }
          echo "Hub RuneLite version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ steps.hub.outputs.version }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and test against the Hub's RuneLite
        run: ./gradlew --no-daemon --console=plain build -PruneLiteVersion=${{ steps.hub.outputs.version }}
      - name: Test report on failure
        if: failure()
        run: |
          for f in build/test-results/test/*.xml; do
            grep -l "<failure\|<error" "$f" 2>/dev/null && sed -n '1,40p' "$f"
          done || true
