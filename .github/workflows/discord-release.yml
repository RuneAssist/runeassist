name: Discord release notes

# When a GitHub Release is published (do this after the Plugin Hub merges a
# version), post its title and notes to #changelog and #announcements on the
# RuneAssist Flipping Discord. Secrets: DISCORD_CHANGELOG_WEBHOOK_URL and
# DISCORD_ANNOUNCEMENTS_WEBHOOK_URL. Drafts and pre-releases post nothing.

on:
  release:
    types: [published]

jobs:
  post:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          MARK = {'new': '\U0001F195', 'improved': '\u2B06\uFE0F', 'fixed': '\U0001F527', 'good to know': '\u2139\uFE0F'}
          title = os.environ.get('NAME') or os.environ.get('TAG') or 'Release'
          body = re.sub(r'\n{3,}', '\n\n', (os.environ.get('BODY') or '').replace('\r', '')).strip()
          def bullets(lines):
              return '\n'.join('\u2022 ' + l.strip()[2:].strip() if l.strip()[:2] in ('- ', '* ') else l.strip()
                               for l in lines if l.strip())
          intro, fields, current = [], [], None
          for line in body.split('\n'):
              heading = re.match(r'^#{1,3}\s+(.*\S)\s*$', line)
              if heading:
                  current = {'name': heading.group(1), 'lines': []}
                  fields.append(current)
              elif current is not None:
                  current['lines'].append(line)
              else:
                  intro.append(line)
          embed = {
              'author': {'name': 'Plugin update ' + (os.environ.get('TAG') or '')},
              'title': ('RuneAssist Flipping: ' + title)[:256],
              'url': os.environ['URL'],
              'description': ('**Now on the Plugin Hub.** Restart RuneLite to update.\n' + bullets(intro)).strip()[:4000],
              'color': 0x5865F2,
              'fields': [{'name': ((MARK.get(f['name'].lower(), '') + ' ').lstrip() + f['name'])[:256],
                          'value': bullets(f['lines'])[:1024]} for f in fields if bullets(f['lines'])][:10],
              'footer': {'text': 'RuneAssist Flipping'},
          }
          payload = json.dumps({'embeds': [embed], 'allowed_mentions': {'parse': []}}).encode()
          if os.environ.get('DRY_RUN'):
              print(payload.decode()); raise SystemExit(0)
          for name in ('CHANGELOG_WEBHOOK', 'ANNOUNCE_WEBHOOK'):
              hook = os.environ.get(name)
              if not hook: print(name, 'unset; skipped'); continue
              req = urllib.request.Request(hook, data=payload, headers={'Content-Type': 'application/json', 'User-Agent': 'runeassist-release'})
              with urllib.request.urlopen(req, timeout=15) as r: print(name, 'posted', r.status)
          PY
