plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.runelite.net' }
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

// Isolated runtime classpath for the headless LLM provider smoke test.
// Kept separate so the plugin jar / official dependencies are unaffected.
configurations {
    smoke
}

dependencies {
    smoke 'com.squareup.okhttp3:okhttp:4.12.0'
    smoke 'com.google.code.gson:gson:2.10.1'
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.output + configurations.smoke
    mainClass = 'com.osrsmcp.ProviderSmokeTest'
}

group = 'com.osrsmcp'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes('Plugin-Class': 'com.osrsmcp.OsrsMcpPlugin')
    }
}
